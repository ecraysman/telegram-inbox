# Included inside the http {} block (conf.d/default.conf). Contracts §7.7.
# Single origin: the browser talks only to this server, so no CORS is needed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API. No URI part in proxy_pass, so the path is passed unchanged.
    location /api/ {
        proxy_pass http://api:8080;
    }

    # SignalR hub: WebSocket upgrade, no buffering, long-lived connections.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
