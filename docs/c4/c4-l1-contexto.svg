<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1300" height="720" fill="#fff"/>
<text x="20" y="22" font-size="16" font-weight="bold" fill="#222">C4 Nivel 1: Contexto del sistema, Bandeja conversacional</text>
<rect x="80" y="120" width="200" height="90" rx="8" fill="#08427B" stroke="#073B6F"/>
<text x="180.0" y="148.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Operador</text>
<text x="180.0" y="162.0" font-size="11" fill="#FFFFFF" text-anchor="middle">[Persona]</text>
<text x="180.0" y="176.0" font-size="11" fill="#FFFFFF" text-anchor="middle">Atiende a los clientes</text>
<text x="180.0" y="190.0" font-size="11" fill="#FFFFFF" text-anchor="middle">desde la bandeja web</text>
<rect x="1020" y="120" width="200" height="90" rx="8" fill="#08427B" stroke="#073B6F"/>
<text x="1120.0" y="148.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Usuario de Telegram</text>
<text x="1120.0" y="162.0" font-size="11" fill="#FFFFFF" text-anchor="middle">[Persona]</text>
<text x="1120.0" y="176.0" font-size="11" fill="#FFFFFF" text-anchor="middle">Cliente que escribe</text>
<text x="1120.0" y="190.0" font-size="11" fill="#FFFFFF" text-anchor="middle">al bot de la empresa</text>
<rect x="450" y="330" width="300" height="120" rx="8" fill="#1168BD" stroke="#0B4884"/>
<text x="600.0" y="373.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Bandeja conversacional</text>
<text x="600.0" y="387.0" font-size="11" fill="#FFFFFF" text-anchor="middle">[Sistema de software]</text>
<text x="600.0" y="401.0" font-size="11" fill="#FFFFFF" text-anchor="middle">Recibe los mensajes del bot, los muestra</text>
<text x="600.0" y="415.0" font-size="11" fill="#FFFFFF" text-anchor="middle">en tiempo real y permite responderlos</text>
<rect x="1000" y="330" width="240" height="90" rx="8" fill="#999999" stroke="#6B6B6B"/>
<text x="1120.0" y="358.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Telegram Bot API</text>
<text x="1120.0" y="372.0" font-size="11" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="1120.0" y="386.0" font-size="11" fill="#FFFFFF" text-anchor="middle">Entrega mensajes al bot</text>
<text x="1120.0" y="400.0" font-size="11" fill="#FFFFFF" text-anchor="middle">y envía las respuestas</text>
<rect x="450" y="580" width="300" height="90" rx="8" fill="#999999" stroke="#6B6B6B"/>
<text x="600.0" y="608.0" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ngrok cloud</text>
<text x="600.0" y="622.0" font-size="11" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="600.0" y="636.0" font-size="11" fill="#FFFFFF" text-anchor="middle">URL pública HTTPS que reenvía</text>
<text x="600.0" y="650.0" font-size="11" fill="#FFFFFF" text-anchor="middle">al túnel del agente local</text>
<polyline points="180,210 180,390 450,390" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="174.2" y="286.0" width="191.60000000000002" height="28" fill="#fff" fill-opacity="0.92"/>
<text x="270" y="297.0" font-size="10" fill="#222" text-anchor="middle">Ve conversaciones y responde</text>
<text x="270" y="309.0" font-size="10" fill="#222" text-anchor="middle">(HTTP + WebSocket, localhost:4200)</text>
<polyline points="1120,210 1120,330" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1043.1" y="256.0" width="153.8" height="28" fill="#fff" fill-opacity="0.92"/>
<text x="1120" y="267.0" font-size="10" fill="#222" text-anchor="middle">Escribe y recibe respuestas</text>
<text x="1120" y="279.0" font-size="10" fill="#222" text-anchor="middle">(app de Telegram)</text>
<polyline points="1060,420 1060,625 750,625" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="842.0" y="576.0" width="116.0" height="28" fill="#fff" fill-opacity="0.92"/>
<text x="900" y="587.0" font-size="10" fill="#222" text-anchor="middle">Webhook HTTPS :443</text>
<text x="900" y="599.0" font-size="10" fill="#222" text-anchor="middle">(update de Telegram)</text>
<polyline points="600,580 600,450" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="517.7" y="501.0" width="164.60000000000002" height="28" fill="#fff" fill-opacity="0.92"/>
<text x="600" y="512.0" font-size="10" fill="#222" text-anchor="middle">Túnel hacia el agente local</text>
<text x="600" y="524.0" font-size="10" fill="#222" text-anchor="middle">(solo POST /telegram/webhook)</text>
<polyline points="750,380 1000,380" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="806.2" y="341.0" width="137.60000000000002" height="28" fill="#fff" fill-opacity="0.92"/>
<text x="875" y="352.0" font-size="10" fill="#222" text-anchor="middle">setWebhook / sendMessage</text>
<text x="875" y="364.0" font-size="10" fill="#222" text-anchor="middle">HTTPS</text>
<text x="20" y="696" font-size="10" fill="#555">Leyenda: azul oscuro = persona, azul = sistema propio, gris = sistema externo. Flechas etiquetadas con propósito y protocolo.</text>
</svg>